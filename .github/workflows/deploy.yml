name: Deploy NEKO JOURNEY PLAY

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack complete Web game and verify tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/neko-game
          unzip -q bundle/NEKO-JOURNEY-FOUR-REGIONS-GAME.zip -d /tmp/neko-game
          cd /tmp/neko-game/web-native
          npm run check
          npm test
          npm run build
          mkdir -p "$GITHUB_WORKSPACE/_site"
          cp -R dist/. "$GITHUB_WORKSPACE/_site/"
          test -f "$GITHUB_WORKSPACE/_site/assets/cats.png"
          for i in 0 1 2 3; do test -f "$GITHUB_WORKSPACE/_site/assets/bg_${i}.png"; done
          test -f "$GITHUB_WORKSPACE/_site/src/visuals.js"
          echo "Four chapters, visual assets and browser scripts packaged."
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Validate HTTPS game entry and art assets
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SITE_URL"
          SITE_URL="${SITE_URL%/}/"
          for i in $(seq 1 24); do
            if curl -fsSL --connect-timeout 8 --max-time 18 "$SITE_URL" -o /tmp/neko-index.html &&
               grep -q 'NEKO JOURNEY' /tmp/neko-index.html &&
               curl -fsSL "${SITE_URL}src/visuals.js" -o /tmp/neko-visuals.js &&
               curl -fsSL "${SITE_URL}assets/bg_0.png" -o /tmp/neko-bg.png; then
              echo "NEKO JOURNEY live release: $SITE_URL"
              {
                echo "### NEKO JOURNEY — Four Regions"
                echo "$SITE_URL"
                echo "Published HTML, JavaScript and PNG game art verified over HTTPS."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          exit 1
